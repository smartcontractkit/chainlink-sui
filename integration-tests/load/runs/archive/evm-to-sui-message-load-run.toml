# Run config for EVM → Sui message-only WASP load test
# Uses N parallel wallets, each with its own generator.

[run]
env = "testnet"
source_chain_selector = "10344971235874465080"
dest_chain_selector = "9762610643973837292"
message_count = 10
message_data = "hello from evm load test"

[receiver]
# 32-byte Sui receiver package ID (hex-encoded)
address = "0x1810288cfa4414848aad6d0d11afcb95836255d195c114d902fd933e5965511e"

[gas]
sui_gas_budget = 1000000000
evm_gas_limit = 100000
evm_callback_gas_limit = 200000

[load]
# Total target RPS across all wallets.
rps = 5
# Number of parallel wallets (and WASP generators).
# Each wallet sends at rps/wallets = 1 RPS.
wallets = 5
