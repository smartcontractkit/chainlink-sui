name: CCIP Integration Tests (Sui)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

concurrency:
  group: ccip-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ccip_sui_tests:
    name: Run ${{ matrix.test_name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_id: smoke/ccip/ccip_sui_messaging_test.go:Test_CCIP_Messaging_Sui2EVM
            test_name: Test_CCIP_Messaging_Sui2EVM
            test_env_type: in-memory
            runs_on: ubuntu-latest
            test_cmd: go test ./smoke/ccip -run "Test_CCIP_Messaging_Sui2EVM" -timeout 10m -test.parallel=1 -count=1

          - test_id: smoke/ccip/ccip_sui_messaging_test.go:Test_CCIP_Messaging_EVM2Sui
            test_name: Test_CCIP_Messaging_EVM2Sui
            test_env_type: in-memory
            runs_on: ubuntu-latest
            test_cmd: go test ./smoke/ccip -run "Test_CCIP_Messaging_EVM2Sui" -timeout 10m -test.parallel=1 -count=1
    env:
      TEST_ENV_TYPE: ${{ matrix.test_env_type }}
      CL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chainlink_test?sslmode=disable
      GOPRIVATE: github.com/smartcontractkit/*
      GH_PAT_READ: ${{ secrets.GH_PAT_READ }}

    services:
      postgres:
        image: postgres:15.2-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chainlink_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1️ Checkout PR branch of chainlink-sui
      - name: Checkout chainlink-sui
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: temp/chainlink-sui
          fetch-depth: 1

      # 2️ Checkout core chainlink repo (pinned)
      - name: Checkout chainlink
        uses: actions/checkout@v4
        with:
          repository: smartcontractkit/chainlink
          ref: main
          path: temp/chainlink
          fetch-depth: 1

      # 3️ Read Go version dynamically
      - name: Read Go version
        id: go-version
        run: |
          GO_VER=$(grep -E '^golang ' temp/chainlink/.tool-versions | cut -d' ' -f2)
          echo "GO_VERSION=$GO_VER" >> $GITHUB_OUTPUT

      # 4️ Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.GO_VERSION }}
          cache: true

      # 5️ Configure Git for private modules
      - name: Configure Git
        run: git config --global url."https://${GH_PAT_READ}@github.com/".insteadOf "https://github.com/"

      # 6️ Build chainlink-sui
      - name: Build chainlink-sui
        working-directory: temp/chainlink-sui
        run: go build -o chainlink-sui ./relayer/cmd/chainlink-sui/main.go

      # 7️ Setup Sui CLI (via composite action)
      - name: Setup Sui CLI
        uses: ./temp/chainlink-sui/.github/actions/setup-sui
        with:
          version: mainnet-v1.57.2

      # 8️ Wait for Postgres
      - name: Wait for Postgres
        run: until pg_isready -h localhost -U postgres; do sleep 1; done

      # 9️ Prepare DB
      - name: Prepare database
        run: |
          cd temp/chainlink
          make testdb

      # 10 Run the integration test (human-readable output)
      - name: Run ${{ matrix.test_name }}
        env:
          CL_DATABASE_URL: ${{ env.CL_DATABASE_URL }}
          TEST_ENV_TYPE: ${{ env.TEST_ENV_TYPE }}
          CL_SUI_CMD: ${{ github.workspace }}/temp/chainlink-sui/chainlink-sui
        run: |
          cd temp/chainlink/integration-tests
          echo "=== Running ${{ matrix.test_name }} ==="
          go test ./smoke/ccip \
            -run "${{ matrix.test_name }}" \
            -timeout 10m \
            -parallel 4 \
            -count=1 \
            -v

      # 1️1 Upload JSON output for each test
      - name: Upload ${{ matrix.test_name }} results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test_name }}-results
          path: ${{ matrix.test_name }}-results.json
