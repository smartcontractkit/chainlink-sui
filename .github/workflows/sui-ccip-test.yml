name: CCIP Integration Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ccip-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ccip_test_sui2evm:
    name: Run Sui2EVM Test
    runs-on: ubuntu-latest

    env:
      DEFAULT_CORE_REF: sish/sui-evm-test-1
      GH_PAT_READ: ${{ secrets.GH_PAT_READ }}
      GOPRIVATE: github.com/smartcontractkit/chainlink-sui
      CL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chainlink_test?sslmode=disable

    services:
      postgres:
        image: postgres:15.2-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chainlink_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    strategy:
      matrix:
        sui_version: [mainnet-v1.50.1]

    steps:
      # 1) Checkout both repos
      - name: Checkout chainlink-sui
        uses: actions/checkout@v4
        with:
          repository: smartcontractkit/chainlink-sui
          ref: 682007ecdc10d1c7a9191b71bd318c9c85e01f89
          path: temp/chainlink-sui
          fetch-depth: 1

      - name: Checkout chainlink
        uses: actions/checkout@v4
        with:
          repository: smartcontractkit/chainlink
          ref: daa1f621fbc3c053c31db6b1f0a8043c86dbeafb
          path: temp/chainlink
          fetch-depth: 1

      # 2) Read Go version
      - name: Read Go version
        id: go-version
        run: |
          GO_VER=$(grep -E '^golang ' temp/chainlink/.tool-versions | cut -d' ' -f2)
          echo "GO_VERSION=$GO_VER" >> $GITHUB_OUTPUT

      # 3) Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.GO_VERSION }}
          cache: true

      # 4) Configure Git for private modules
      - name: Configure Git & GOPRIVATE
        run: |
          git config --global url."https://${GH_PAT_READ}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/smartcontractkit/*" >> $GITHUB_ENV
        env:
          GH_PAT_READ: ${{ secrets.GH_PAT_READ }}

      # 5) Cache Go modules
      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        id: cache-go
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-mods-${{ hashFiles('temp/chainlink/go.sum','temp/chainlink-sui/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mods-

      # 6) Pin & tidy the core module
      - name: Fetch & pin chainlink-sui
        run: |
          cd temp/chainlink
          go get github.com/smartcontractkit/chainlink-sui@682007ecdc10d1c7a9191b71bd318c9c85e01f89
          go mod tidy

      # 7) Tidy integration-tests module
      - name: Tidy integration-tests
        run: |
          cd temp/chainlink/integration-tests/smoke/ccip
          go mod tidy

      # 8) Build LOOP plugin
      - name: Build LOOP plugin
        working-directory: temp/chainlink-sui
        run: go build -o chainlink-sui ./relayer/cmd/chainlink-sui/main.go

      # 9) Setup Sui CLI using your reusable composite action
      - name: Setup Sui CLI
        uses: ./.github/actions/setup-sui
        with:
          version: ${{ matrix.sui_version }}

      # 10) Wait for Postgres
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U postgres; do sleep 1; done

      # 11) Prepare DB
      - name: Prepare database
        run: |
          cd temp/chainlink
          make testdb

      # 12) Run the integration test
      - name: Run Test
        env:
          CL_DATABASE_URL: ${{ env.CL_DATABASE_URL }}
          CL_SUI_CMD: ${{ github.workspace }}/chainlink-sui
        run: |
          cd temp/chainlink/integration-tests/smoke/ccip
          go test -v -tags=integration -count=1 -run Test_CCIPMessaging_Sui2EVM ./...
