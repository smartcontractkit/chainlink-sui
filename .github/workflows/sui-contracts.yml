name: Sui - Contracts

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.c.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/changes
        id: c
        with:
          folder: contracts
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.found == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            sandbox = relaxed

      - name: Run tests
        run: |
          nix develop --command task sui_test
